<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開間貓咪咖啡廳</title>
    <style>
        /* 全局設定：背景改成咖啡店溫馨氛圍 */
        body {
            font-family: "PingFang TC", "Heiti TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    
             /* 1. 把這三行加進去，取代原本的 background 漸層 */
    	    background-image: url("cafe-bg.png"); /* 括號內填寫你的圖片檔名 */
    	    background-size: cover;              /* 讓圖片自動鋪滿整個手機或電腦螢幕 */
    	    background-position: center;         /* 讓圖片置中對齊 */
    	    background-attachment: fixed;        /* 讓背景固定，滑動時不會亂跑 */
            color: #4a3c31; /* 深咖啡色字體 */
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            margin: 0;
        }

        /* 遊戲主要容器：手機友善滿版，色號 #F3CD97 */
        #game-container {
            background-color: #F3CD97;
            border: 4px solid #d4ab73; /* 咖啡色邊框 */
            border-radius: 18px;       /* 圓潤對話框 */
            padding: 25px;
            width: 92%;                /* 手機版左右留邊 */
            max-width: 500px;           /* 桌電版最大寬度 */
            box-sizing: border-box;
            min-height: 380px;
            box-shadow: 0 10px 25px rgba(74, 60, 49, 0.2); /* 溫暖陰影 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .section {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 20px;
            font-weight: 500;
        }
	/* 「歡迎進入遊戲！」的專屬大外框樣式 */
	.welcome-title {
    		display: block;               /* 讓它獨立一行 */
    		text-align: center;           /* 文字置中 */
    		font-size: 24px;              /* 放大字體 */
    		font-weight: bold;            /* 加粗 */
    		background-color: #BC4F4F;    /* 色號#BC4F4F外框背景 */
    		color: white;                 /* 白色文字 */
    		padding: 10px;                /* 內鄰近留白，讓外框更好看 */
    		border-radius: 8px;           /* 微微圓角 */
    		margin-bottom: 20px;          /* 與下一段文字保持距離 */
	}

	/* 數字「20」的專屬小外框樣式 */
	.highlight-box {
    		background-color: #BC4F4F;    /* 色號#BC4F4F外框背景 */
    		color: white;                 /* 白色文字 */
    		padding: 2px 8px;             /* 左右留一點邊，像個小標籤 */
    		border-radius: 4px;           /* 微微圓角 */
    		font-weight: bold;            /* 讓數字更明顯 */
    		display: inline-block;        /* 確保外框包覆緊密 */
    		margin: 0 2px;
	}


        .input-group {
            margin: 25px 0;
            text-align: center;
        }

        /* 輸入框與圓角 */
        input[type="text"] {
            padding: 12px;
            font-size: 18px;
            width: 85%;
            border: 2px solid #d4ab73;
            border-radius: 10px;
            outline: none;
            text-align: center;
            background-color: #fffaf5;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #E98B50;
        }

        /* 按鈕：色號 #E98B50，大圓角，具備手指/滑鼠放大特效 */
        .btn {
            background-color: #E98B50;
            color: white;
            border: none;
            border-radius: 25px;       /* 可愛的大圓角 */
            padding: 14px 28px;        /* 加大點擊面積 */
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;               /* 手機自動滿版 */
            max-width: 220px;          /* 桌電限制寬度 */
            margin: 0 auto;
            display: block;
            box-shadow: 0 4px 10px rgba(233, 139, 80, 0.3);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s; /* 彈性縮放 */
	/* 遊戲圖片專用控制：置中、大圓角、手機不撐爆 */
		.game-img {
    		display: block;            /* 讓圖片獨立占一行才能置中 */
    		margin: 15px auto;         /* 上下空15像素，左右自動置中 */
    		width: 100%;               /* 在手機上自動適應寬度 */
    		max-width: 180px;          /* 限制最大寬度在 180 像素，避免太大隻 */
    		border-radius: 12px;       /* 幫圖片加上溫柔的小圓角 */
    		box-shadow: 0 4px 10px rgba(74, 60, 49, 0.1); /* 淡淡的陰影，讓畫面更精緻 */
		}
        }

        /* 滑鼠移過去與手指按住的微微放大特效 */
        .btn:hover, .btn:active {
            transform: scale(1.06);    /* 微微放大 6% */
            box-shadow: 0 6px 15px rgba(233, 139, 80, 0.5); 
            background-color: #df793b; /* 顏色微微加深 */
        }

        /* 詐騙說明畫面特殊外觀 */
        #birthday-screen {
            position: relative;
            background-color: #fffaf5;
            border: 2px dashed #d4ab73;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
        }

        .red-x {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 26px;
            color: #ff5252;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .red-x:hover, .red-x:active {
            transform: scale(1.2);     /* 叉叉按的時候變大 */
        }

        .bday-input {
            padding: 12px;
            font-size: 18px;
            text-align: center;
            cursor: pointer;
            width: 70%;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: #fff;
        }

        .alert-text {
            font-size: 19px;
            line-height: 1.7;
            color: #4a3c31;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game-content">
            <!-- 一、 遊戲開頭 -->
<div id="welcome-view">
    <div class="section">
        <span class="welcome-title">歡迎進入遊戲！</span>
        你的任務是要存到<span class="highlight-box">20</span>萬金幣，開一家貓咪咖啡廳。<br><br>
        你的銀行帳戶是202608131026，裡面有存款5 萬金幣。
    </div>
    
    <!-- 插入小獅子泡咖啡圖片 -->
    <img src="coffee-lion.png" style="display: block; margin: 15px auto; width: 100%; max-width: 180px; border-radius: 12px;" alt="小獅子泡咖啡">

    <div class="input-group">
        <label for="nickname">請輸入遊戲暱稱：</label>
        <input type="text" id="nickname" placeholder="">
    </div>
    <div>
        <button class="btn" onclick="submitNickname()">下一步</button>
    </div>
</div>

        </div>
    </div>

<script>
    let gameState = {
        playerName: "",
        coins: 50000,
        account: "202608131026"
    };

    let cameFromWarning = false; 

    function submitNickname() {
        const nameInput = document.getElementById('nickname').value;
        if (nameInput === "") {
            alert("請輸入遊戲暱稱喔！");
            return;
        }
        gameState.playerName = nameInput;
        showBirthdayScreen();
    }

    function showBirthdayScreen() {
        const content = document.getElementById('game-content');
        content.innerHTML = `
            <div id="birthday-screen">
                <div class="red-x" onclick="clickRedX()">❌</div>
                <h3>輸入生日開始遊戲</h3>
                <div class="input-group">
                    <input type="text" class="bday-input" placeholder="請點選此處輸入生日" readonly onclick="clickBirthdayInput()">
                </div>
            </div>
        `;
    }

    function clickBirthdayInput() {
        cameFromWarning = true; 
        const content = document.getElementById('game-content');
        content.innerHTML = `
            <div class="alert-text">
                不可以隨意交出身分訊息！在遊戲中有詐騙任務，如果沒做出正確反應，就會被扣錢。請跳出後按紅叉叉接續遊戲
            </div>
        `;

        setTimeout(() => {
            showBirthdayScreen();
        }, 8000);
    }

    function clickRedX() {
        if (cameFromWarning) {
            enterNextMission();
            return;
        }

        const content = document.getElementById('game-content');
        content.innerHTML = `
            <div class="alert-text">
                很棒！你沒有交出身分訊息！在遊戲中有詐騙任務，如果沒做出正確反應，就會被扣錢。
            </div>
        `;

        setTimeout(() => {
            enterNextMission();
        }, 8000);
    }

    function enterNextMission() {
        const content = document.getElementById('game-content');
        content.innerHTML = `
            <h3>🐾 遊戲內容開始</h3>
            <p>歡迎，<b>${gameState.playerName}</b>！</p>
            <p>（請在此處提供下一個任務的腳本，我們再把它接上去）</p>
        `;
    }
</script>

</body>
</html>
